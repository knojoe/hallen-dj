<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hallen-DJ">
<meta name="theme-color" content="#0a0c10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hallen-DJ Soundboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: Profi-Regiepult für den Spieltag – dunkel, klar, satte Farben, nichts Verspieltes.
   IDEA: Das Pult eines Arena-Operators: links Status und Uhr, rechts Kategorien als Karten mit Farbverlauf-Kopf.
   PICTURE: Das Pad-Raster selbst – satte, abgerundete Farbtasten, Laufbalken und Puls beim Abspielen.
   COLOUR+TYPE: Nachtblau-Schwarz mit Türkis/Violett-Schimmer, Kategoriefarben als volle Flächen. Bebas Neue + Manrope.
   LAYOUT: Kopfleiste mit Reitern, Seitenleiste 270px, Board rechts, Mixer unten. */
:root{color-scheme:dark;--bg:#090c12;--panel:#111620;--panel2:#161c28;--line:rgba(255,255,255,.08);--ink:#f3f6fa;--mute:#8b95a7;--stop:#ef4444;--go:#22c55e;--acc:#f5b40b}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--ink);font:15px/1.45 Manrope,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;
  background:radial-gradient(900px 420px at 15% -8%,rgba(20,184,166,.16),transparent 70%),radial-gradient(800px 560px at 105% 35%,rgba(168,85,247,.13),transparent 70%),
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/48px 48px,var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* Kopfleiste */
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:10px 12px 0;background:rgba(17,22,32,.82);border:1px solid var(--line);border-radius:16px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none}
.brand img{height:40px;width:auto;max-width:90px;object-fit:contain}
.brand img[hidden]{display:none}
.brand .ico{width:26px;height:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.brand .ico i{border-radius:2px}
.brand img:not([hidden])+.ico{display:none}
.brand .bt{font:400 26px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:1px}
.tabs{flex:1;display:flex;gap:4px;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;margin:0 auto;max-width:max-content}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:9px;font:600 14px Manrope;color:#c6cdd8;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab b{font-weight:600;color:var(--mute);font-size:12px}
.tab.sel{background:var(--c);color:#06110d;box-shadow:0 4px 16px -6px var(--c)}
.tab.sel i{background:rgba(0,0,0,.35)}.tab.sel b{color:rgba(0,0,0,.55)}
.tab.live i{animation:dot .9s ease-in-out infinite}
@keyframes dot{50%{transform:scale(1.8);box-shadow:0 0 12px 2px var(--c)}}
.tab.addc{color:var(--mute);border:1.5px dashed var(--line)}
.tools{display:flex;gap:6px;flex:none}
.btn{min-height:44px;padding:0 14px;border-radius:10px;font:700 13.5px Manrope;letter-spacing:.2px;background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap;color:#dfe5ee}
.btn:active{transform:scale(.97)}
.btn.on{background:#fff;color:#000}
.btn:disabled{opacity:.4}
.btn.pri,.btn.go{background:var(--go);color:#04140a;border-color:transparent}
.btn.stop{background:rgba(239,68,68,.16);color:#ffb4b4;border-color:rgba(239,68,68,.35)}
.btn.stop:active{background:var(--stop);color:#fff}
.btn.fade{background:rgba(245,180,11,.13);color:#ffd77a;border-color:rgba(245,180,11,.3)}
.btn.del{color:#ff8a8a}
/* Rahmen */
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;padding:12px;transition:grid-template-columns .25s}
.wrap.slim{grid-template-columns:76px minmax(0,1fr)}
.sidetg{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#c6cdd8;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.wrap.slim .side{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;scrollbar-width:none}
.panel{background:rgba(17,22,32,.82);border:1px solid var(--line);border-radius:14px;padding:14px}
.ph{display:flex;justify-content:space-between;align-items:center;font:700 11px Manrope;letter-spacing:2.2px;color:var(--mute);margin-bottom:10px}
.stat{font:700 10.5px Manrope;letter-spacing:1px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mute)}
.stat.live{background:rgba(34,197,94,.18);color:#6ee79a}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:10px}
#now{display:grid;gap:8px}
#now .idle{display:block;padding:12px;border-radius:10px;background:rgba(0,0,0,.25);color:var(--mute);font-size:13px}
.chip{display:grid;gap:6px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-left:4px solid var(--c);text-align:left}
.chip b{font:700 15px Manrope;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font:600 11.5px Manrope;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.chip strong{color:var(--ink);font:800 14px Manrope;font-variant-numeric:tabular-nums}
.chip em{font-style:normal}
.chip .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.chip .bar i{display:block;height:100%;width:0;background:var(--c)}
.btn.mic{width:100%;min-height:58px;font:400 24px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:1.5px;background:rgba(255,255,255,.05)}
.btn.mic.on{background:#fff;color:#000;animation:micp 1s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 4px rgba(255,255,255,.3),0 0 26px rgba(255,255,255,.45)}}
.master{display:flex;align-items:center;gap:10px;margin-top:12px}
.master label{font:700 11px Manrope;letter-spacing:2px;color:var(--mute)}
.master output{font:800 15px Manrope;width:34px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;height:40px;accent-color:#14b8a6;background:none}
/* WümmeTicker */
.tg{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;padding:9px 6px 10px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);margin-bottom:6px}
.tg:last-child{margin-bottom:0}
.tg .lg{grid-column:1/-1;font:700 9.5px Manrope;letter-spacing:1.2px;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px;padding:0 4px;white-space:nowrap;overflow:hidden}
.tg .lg span:first-child{overflow:hidden;text-overflow:ellipsis}
.tm2{display:grid;justify-items:center;gap:4px;text-align:center;font:700 11px/1.15 Manrope;color:#aeb7c4}
.tm2.us{color:#fff}
.tm2 img{width:30px;height:30px;object-fit:contain}
.tm2 i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08)}
.tm2 span{max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.tg:not(.live):not(.end) .sc b{font-size:24px;color:#c6cdd8}
.sc{text-align:center;min-width:64px}
.sc b{display:block;font:400 30px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:1px;font-variant-numeric:tabular-nums}
.sc small{display:block;font:700 10px Manrope;color:var(--mute);margin-top:3px;white-space:nowrap}
.tg.live{border-color:rgba(239,68,68,.5);background:linear-gradient(180deg,rgba(239,68,68,.12),rgba(0,0,0,.28))}
.tg.end .sc b{color:#aeb7c4}
.lv{color:#ff8080;display:inline-flex;align-items:center;gap:4px}
.lv::before{content:"";width:6px;height:6px;border-radius:50%;background:#ef4444;animation:dot 1s infinite}
.sc.flash b{animation:flash 1.4s ease-out}
@keyframes flash{0%{color:#22c55e;transform:scale(1.3)}100%{transform:none}}
.stat.red{background:rgba(239,68,68,.2);color:#ff9a9a}
.tkmsg{font-size:12.5px;color:var(--mute);padding:10px;border-radius:10px;background:rgba(0,0,0,.25)}
.tkmore{font:700 11px Manrope;color:var(--mute);text-align:center;padding-top:4px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-bottom:6px;text-align:left;width:100%}
.lrow b{display:block;font:700 14px Manrope;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow small{display:block;font:600 11.5px Manrope;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .du{font:700 13px Manrope;color:var(--mute);font-variant-numeric:tabular-nums}
.lrow.cur{border-color:#14b8a6;background:rgba(20,184,166,.12)}
.lpick{cursor:pointer}
#lList{max-height:min(52vh,460px);overflow-y:auto;margin:10px 0}
.miss{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:rgba(245,180,11,.1);border:1px solid rgba(245,180,11,.35);flex:none}
.miss div{flex:1 1 260px}.miss b{display:block;font:800 15px Manrope;color:#ffd77a}.miss span{font-size:13px;color:#d9c79a}
.sec.over{outline:3px dashed #fff;outline-offset:-3px;background:rgba(255,255,255,.06)}
.pad.dragging{opacity:.25}
.pad.ghost,.ghost{position:fixed;margin:0;z-index:40;pointer-events:none;max-width:200px;transform:translate(-50%,-50%) rotate(-3deg) scale(1.05);box-shadow:0 18px 40px rgba(0,0,0,.6);opacity:.95}
.dropmark{outline:3px solid #fff;outline-offset:2px}
.tab.dropmark{outline-offset:-2px;background:#fff;color:#000;transform:scale(1.08)}
.grip{position:absolute;z-index:3;top:5px;right:5px;width:42px;height:42px;border-radius:9px;background:rgba(0,0,0,.42);display:grid;align-content:center;justify-items:center;gap:4px;touch-action:none;cursor:grab}
.grip i{display:block;width:18px;height:2.5px;border-radius:2px;background:#fff}
.pad.pl .grip{top:4px;right:4px;width:36px;height:36px}
body.dragging-now,body.dragging-now *{cursor:grabbing!important}
.editing .pad[data-pad]:not(.pl) .nm{padding-right:42px}
.diag{max-height:260px;overflow-y:auto;font:500 12.5px/1.5 Manrope;background:#05070b;border:1px solid var(--line);border-radius:10px;padding:10px;color:#c6cdd8;-webkit-user-select:text;user-select:text}
.diag b{color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
/* Board */
main{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:12px;scrollbar-width:thin}
.sec{background:rgba(17,22,32,.82);border:1px solid var(--line);border-radius:16px;overflow:hidden;flex:none}
.sec h2{margin:0;padding:11px 16px;font:800 12px Manrope;letter-spacing:3px;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,var(--c),var(--c2));text-shadow:0 1px 2px rgba(0,0,0,.25);display:flex;justify-content:space-between}
.sec h2 i{display:none}
.sec h2 small{font:700 11px Manrope;letter-spacing:1px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:10px;padding:14px}
.pad{position:relative;overflow:hidden;-webkit-touch-callout:none;aspect-ratio:1.3;border-radius:11px;background:var(--c);color:#fff;text-align:left;padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px -8px rgba(0,0,0,.7);transition:transform .08s}
.pad:active{transform:scale(.96)}
.pad .nm{position:relative;font:700 clamp(13px,1.35vw,16px)/1.2 Manrope;text-shadow:0 1px 2px rgba(0,0,0,.2);overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pad .meta{position:relative;display:flex;justify-content:space-between;align-items:end;gap:6px;font:600 11px Manrope;color:rgba(255,255,255,.82)}
.pad .meta span{white-space:nowrap}
.pad .meta .tm{order:2;font:700 11px Manrope;font-variant-numeric:tabular-nums}
.pad .key{position:absolute;top:9px;right:10px;font:700 11px Manrope;color:rgba(255,255,255,.6)}
.pad .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,255,255,.24)}
.pad .off{display:none;position:absolute;bottom:10px;left:11px;font:800 9.5px Manrope;letter-spacing:1px;background:#fff;color:#000;padding:3px 7px;border-radius:5px}
.pad.play{animation:pulse 1s ease-in-out infinite}
.pad.play .off{display:block}.pad.play .key,.pad.play .meta span:not(.tm):not(.pn){visibility:hidden}
.pad.play .tm{font:800 17px Manrope;color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px #fff,0 0 14px -2px var(--c)}50%{box-shadow:0 0 0 4px #fff,0 0 36px 8px var(--c);filter:brightness(1.18)}}
.pad.fading{animation:none;opacity:.55}
.pad.fading .off{background:#8b95a7}
.pad.empty{background:transparent;border:1.5px dashed color-mix(in srgb,var(--c) 60%,transparent);color:var(--mute);box-shadow:none}
.pad.add{background:transparent;color:var(--mute);border:1.5px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;text-align:center;font:700 13px Manrope}
.pad.ld .tm::after{content:" · lädt";opacity:.75}
.editing .pad:not(.add)::after{content:"Bearbeiten";position:absolute;bottom:8px;left:10px;font:800 9.5px Manrope;letter-spacing:1px;text-transform:uppercase;background:rgba(0,0,0,.45);color:#fff;padding:3px 7px;border-radius:5px}
.editing .pad .meta{opacity:.0}
.pad.pl{aspect-ratio:1;justify-content:center;align-items:center;text-align:center;padding:8px}
.pad.pl .nr{position:relative;font:400 clamp(42px,5.5vw,70px)/.9 "Bebas Neue",Impact,sans-serif}
.pad.pl .meta{flex-direction:column;align-items:center;gap:1px;margin-top:2px}
.pad.pl .pn{font:800 12.5px Manrope;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pad.pl .tm{order:0;font-size:10.5px}
.pad.pl.play .tm{font-size:15px}
.pad.pl .off{left:50%;bottom:auto;transform:translateX(-50%);top:7px}
.empty-st{padding:40px 10px;text-align:center;color:var(--mute)}
/* Dialoge */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.open{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:20px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);-webkit-user-select:text;user-select:text}
.dlg h3{font:400 30px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:1px;margin:0 0 14px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>span{font:600 13px Manrope;color:var(--mute);display:flex;justify-content:space-between}
.fld>span output{color:var(--ink);font-weight:800}
.txt,select{width:100%;min-height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#0b0f16;font-size:16px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:40px;height:40px;border-radius:10px;background:var(--c);border:3px solid transparent}
.sw button.sel{border-color:#fff}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.chk input{width:24px;height:24px;accent-color:#14b8a6}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.acts .sp{flex:1}
.file{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file small{color:var(--mute)}
.file img{height:44px;max-width:110px;object-fit:contain}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#0b0f16}
summary{list-style:none;cursor:pointer;padding:14px 16px;font:800 14px Manrope;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details[open] summary::after{transform:rotate(-135deg)}
details .in{padding:2px 16px 14px}
.catrow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px 44px 44px;gap:8px;align-items:center;margin-bottom:8px}
.catrow .cdot{width:44px;height:44px;border-radius:10px;background:var(--c)}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:700 17px Manrope}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hint{font-size:13px;color:var(--mute);margin:4px 0 12px}
.wv{position:relative;height:120px;border-radius:10px;background:#05070b;border:1px solid var(--line);touch-action:none}
.wv canvas{position:absolute;inset:0;width:100%;height:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);font:700 13px Manrope}
.seg button.sel{background:#fff;color:#000}
.numbuf{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:400 140px/1 "Bebas Neue",Impact,sans-serif;color:#fff;text-shadow:0 0 40px rgba(20,184,166,.6);pointer-events:none;opacity:0;transition:opacity .15s;z-index:30}
.numbuf.show{opacity:1}
#dImp{width:min(940px,100%);padding:0;display:flex;flex-direction:column}
.ihd{padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.ibody{flex:1;overflow-y:auto;padding:8px 20px}
.ift{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.ift .cnt{margin-right:auto;color:var(--mute);font-weight:700}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.bulk select{width:auto;flex:1 1 220px}
.igrp{margin:14px 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.igrp b{font:800 12px Manrope;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin-right:auto}
.igrp select{width:auto;min-width:200px}
.irow{display:grid;grid-template-columns:32px minmax(0,1fr) 200px 44px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.irow input[type=checkbox]{width:24px;height:24px;accent-color:#14b8a6}
.irow .txt,.irow select{min-height:42px}
.irow.no{opacity:.45}
.irow .dup{grid-column:2/-1;font-size:12px;color:var(--acc);margin-top:-4px}
.irow select.need{border-color:var(--acc)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;color:var(--mute);margin:12px 0}
.drop.over{border-color:#fff;color:var(--ink)}
@media(max-width:1100px){.tools .btn{padding:0 10px}}
@media(max-width:980px){.grid{--cols:4!important}.grid.plg{--cols:5!important}}
@media(max-width:860px){.top{flex-wrap:wrap}.tabs{order:3;flex:1 1 100%;max-width:none}.wrap{grid-template-columns:230px minmax(0,1fr)}.grid{--cols:3!important}.grid.plg{--cols:4!important}}

<script>
{
const COLORS=['#14b8a6','#0d9488','#22c55e','#10b981','#84cc16','#eab308','#f97316','#ef4444','#ec4899','#a855f7','#6366f1','#3b82f6','#0ea5e9','#64748b'];
function hue(hex,d){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let H=0,s=0;if(mx!==mn){const e=mx-mn;s=l>.5?e/(2-mx-mn):e/(mx+mn);H=mx===r?(g-b)/e+(g<b?6:0):mx===g?(b-r)/e+2:(r-g)/e+4;H*=60}H=(H+d+360)%360;const f=n=>{const k=(n+H/30)%12,a=s*Math.min(l,1-l);return Math.round((l-a*Math.max(-1,Math.min(k-3,9-k,1)))*255).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
const uid=()=>Math.random().toString(36).slice(2,10);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')};

/* ---------- Speicher (IndexedDB, Fallback: Arbeitsspeicher) ---------- */
let db=null;const mem=new Map();
const openDb=()=>new Promise(res=>{try{const r=indexedDB.open('hallen-dj',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}});
const tx=(mode,fn)=>new Promise((res,rej)=>{if(!db)return res(fn(null));try{const t=db.transaction('kv',mode),s=t.objectStore('kv');const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}catch(e){rej(e)}});
const put=(k,v)=>db?tx('readwrite',s=>s.put(v,k)):(mem.set(k,v),Promise.resolve());
const get=k=>db?tx('readonly',s=>s.get(k)):Promise.resolve(mem.get(k));
const del=k=>db?tx('readwrite',s=>s.delete(k)):(mem.delete(k),Promise.resolve());

/* ---------- Startzustand ---------- */
const mk=(cat,name,sid,o={})=>({id:uid(),catId:cat.id,name,color:'',soundId:sid,vol:90,fadeIn:0,fadeOut:1.5,start:0,end:0,loop:false,excl:'cat',dur:0,...o});
function defaults(){const defCats=[['Einlauf','#6366f1'],['Stimmung','#0ea5e9'],['Tor Heim','#22c55e'],['Torsongs Spieler','#14b8a6'],['7m','#f97316'],['2 Min','#ef4444'],['Auszeit','#eab308'],['Halbzeit','#64748b'],['Sieg','#a855f7']].map(([name,color])=>({id:uid(),name,color,players:name==='Torsongs Spieler'}));
  return{settings:{master:90,fadeAll:2.5,tap:'fade',cols:5,view:'tabs',tab:'all',mig2:1,mig3:1,half:30},cats:defCats,pads:[
  mk(defCats[1],'Stadion-Hupe','gen:horn',{fadeOut:.5,excl:'none'}),
  mk(defCats[1],'Trommelwirbel','gen:drum',{excl:'none'}),
  mk(defCats[6],'Countdown-Piep','gen:beep',{fadeOut:0}),
  mk(defCats[2],'Tor-Jingle (Datei wählen)',null),
  mk(defCats[4],'7m-Spannung (Datei wählen)',null),
  mk(defCats[5],'2 Minuten (Datei wählen)',null),
  mk(defCats[3],'Spielername',null,{nr:'7'})
]}}
let S=defaults();
let editMode=false;

const save=()=>put('state',S).catch(()=>{});

/* ---------- Audio ---------- */
/* Kette: Quelle → Pad-Gain → (Deck A/B) → Master → Sprecher-Absenkung → Limiter → Ausgang
   Kurze Clips (≤ 90 s) liegen dekodiert im Speicher = null Verzögerung.
   Lange Songs laufen gestreamt über ein Audio-Element = kaum Speicherbedarf, kein Absturz bei vielen Songs. */
const AC=window.AudioContext||window.webkitAudioContext;
/* iPhone/iPad: Wiedergabe-Modus VOR dem Audio-Kontext setzen – sonst schaltet der Stumm-Schalter den Ton ab */
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
const ctx=new AC({latencyHint:'interactive'});
const master=ctx.createGain(),duckG=ctx.createGain(),lim=ctx.createDynamicsCompressor();
try{lim.threshold.value=-1.5;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.002;lim.release.value=.15}catch(e){}
master.connect(duckG);duckG.connect(lim);lim.connect(ctx.destination);
const SND=new Map(),AN=new Map(),playing=new Map(),loading=new Map();
/* Alles läuft als Web Audio (iOS blockiert den Audio-Player in der App). Speicher-Limit mit LRU: selten genutzte lange Songs werden entladen und beim Antippen neu dekodiert. */
/* Eigene Seite (GitHub / Home-Bildschirm): lange Songs werden gestreamt = kaum Arbeitsspeicher.
   In der Claude-Vorschau (eingebettet) blockiert iOS das Streamen → dort wird alles dekodiert. */
const EMBED=(()=>{try{return window.top!==window}catch(e){return true}})();
const SHORT=90,BUDGET=(Math.min(screen.width,screen.height)<600?220:380)*1048576;let bufBytes=0;
function evict(keep){while(bufBytes>BUDGET){let v=null;const busy=new Set([...playing.values()].map(o=>o.s));
  for(const [sid,s] of SND)if(s.kind==='buf'&&sid!==keep&&!sid.startsWith('gen:')&&!busy.has(s)&&(!v||(s.last||0)<(v[1].last||0)))v=[sid,s];
  if(!v)break;SND.delete(v[0]);bufBytes-=bytes(v[1].buf);for(const p of S.pads)if(p.soundId===v[0]){const e=padEls.get(p.id);if(e)e.el.classList.add('ld')}}}
const DK={A:ctx.createGain(),B:ctx.createGain()};DK.A.connect(master);DK.B.connect(master);
const MX={x:0,target:null,deck:{A:null,B:null},anim:0};
function setX(v,fromSlider){MX.x=Math.min(1,Math.max(0,v));const a=Math.cos(MX.x*Math.PI/2),b=Math.sin(MX.x*Math.PI/2);
  DK.A.gain.setTargetAtTime(a,ctx.currentTime,.015);DK.B.gain.setTargetAtTime(b,ctx.currentTime,.015);
  const s=document.getElementById('xf');if(s&&!fromSlider)s.value=Math.round(MX.x*1000);
  const t=document.getElementById('xfv');if(t)t.textContent=`A ${Math.round(a*a*100)} · B ${Math.round(b*b*100)}`;updDecks()}
const deckLive=d=>{const id=MX.deck[d];return id&&playing.has(id)&&!playing.get(id).fading};
function autoDeck(){if(MX.target)return MX.target;const loud=MX.x<=.5?'A':'B',quiet=loud==='A'?'B':'A';return deckLive(loud)?quiet:loud}
const vol=v=>Math.pow(Math.max(0,v)/100,2);
master.gain.value=vol(S.settings.master);

function gen(kind){
  const sr=ctx.sampleRate;
  if(kind==='horn'){const d=2.2,b=ctx.createBuffer(2,sr*d,sr);const L=b.getChannelData(0),R=b.getChannelData(1);
    for(let i=0;i<L.length;i++){const t=i/sr;let v=0;for(const f of[233,293,349,466])v+=((t*f)%1)*2-1;v/=3;const env=Math.min(1,t*30)*Math.min(1,(d-t)*6);v=Math.tanh(v*2.2)*env*.55;L[i]=v;R[i]=v}return b}
  if(kind==='drum'){const d=3.2,b=ctx.createBuffer(2,sr*d,sr);const L=b.getChannelData(0),R=b.getChannelData(1);

function drawWave(){const c=document.getElementById('wv');if(!c)return;const p=S.pads.find(x=>x.id===edId);if(!p)return;

/* ---------- Sicherung als ZIP (ohne Base64, Song für Song = wenig Speicher) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8,c=0xFFFFFFFF){for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return c}
const enc=new TextEncoder();
async function makeZip(files,onProg){const parts=[],cd=[];let off=0,i=0;
  for(const f of files){i++;if(onProg)onProg(i,files.length);
    const name=enc.encode(f.name),blob=f.blob instanceof Blob?f.blob:new Blob([f.blob]);
    let c=0xFFFFFFFF;const CH=4*1048576;for(let p=0;p<blob.size;p+=CH){c=crc32(new Uint8Array(await blob.slice(p,p+CH).arrayBuffer()),c)}c=(c^0xFFFFFFFF)>>>0;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint32(14,c,true);lh.setUint32(18,blob.size,true);lh.setUint32(22,blob.size,true);lh.setUint16(26,name.length,true);
    parts.push(lh.buffer,name,blob);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint32(16,c,true);ch.setUint32(20,blob.size,true);ch.setUint32(24,blob.size,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
    cd.push(ch.buffer,name);off+=30+name.length+blob.size}
  const cdSize=cd.reduce((s,b)=>s+(b.byteLength??b.length),0);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e.buffer],{type:'application/zip'})}
async function readZip(blob){const tail=new DataView(await blob.slice(Math.max(0,blob.size-65558)).arrayBuffer());let p=-1;
  for(let i=tail.byteLength-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){p=i;break}if(p<0)throw new Error('kein ZIP');
  const n=tail.getUint16(p+10,true),cdS=tail.getUint32(p+12,true),cdO=tail.getUint32(p+16,true);
  const cd=new DataView(await blob.slice(cdO,cdO+cdS).arrayBuffer()),dec=new TextDecoder(),out={};let q=0;
  for(let k=0;k<n;k++){const meth=cd.getUint16(q+10,true),size=cd.getUint32(q+20,true),nl=cd.getUint16(q+28,true),xl=cd.getUint16(q+30,true),cl=cd.getUint16(q+32,true),lo=cd.getUint32(q+42,true);
    const name=dec.decode(new Uint8Array(cd.buffer,q+46,nl));q+=46+nl+xl+cl;
    const lh=new DataView(await blob.slice(lo,lo+30).arrayBuffer()),start=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    out[name]={meth,blob:blob.slice(start,start+size)}}
  return out}
const dataUrlToBlob=d=>{const [h,b]=d.split(',');const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(h.match(/data:([^;]+)/)||[])[1]||''})};
const safeName=s=>String(s||'sound').replace(/[\\/:*?"<>|]+/g,'_').slice(0,80);
/* Leichte Sicherung: nur Kategorien, Pads und Einstellungen + Liste der Songnamen. Songs kommen beim Wiederherstellen per Ordner wieder rein. */

async function saveFile(fn,blob,okMsg){

async function syncFolder(files){const fl=files.map(x=>x.file||x).filter(isAudio);if(!fl.length){toast('Keine Audiodateien gefunden');return}
  await checkMissing();let fixed=0;
  if(MISSING.size){const before=MISSING.size;await relink(fl);fixed=before-MISSING.size}
  const known=await knownSounds();const fresh=files.filter(x=>{const f=x.file||x;return isAudio(f)&&!known.has(f.name+'|'+f.size)});

let MISSING=new Set();
async function checkMissing(){const keys=new Set((await allKeys()).map(String));MISSING=new Set(S.pads.map(p=>p.soundId).filter(s=>s&&!s.startsWith('gen:')&&!keys.has('snd:'+s)));return MISSING}
const nk=s=>String(s||'').toLowerCase().replace(/\.[^.]+$/,'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
async function relink(files){await checkMissing();if(!MISSING.size){toast('Es fehlen keine Songs');return}
  const want=[...MISSING].map(sid=>({sid,...(S.libNames?.[sid]||{name:(S.pads.find(p=>p.soundId===sid)||{}).name||''})}));
  const fl=files.map(x=>x.file||x).filter(isAudio);let n=0;
  for(const w of want){const f=fl.find(f=>f.name===w.name&&(!w.size||f.size===w.size))||fl.find(f=>f.name.toLowerCase()===String(w.name).toLowerCase())||fl.find(f=>nk(f.name)===nk(w.name));
    if(!f)continue;try{await put('snd:'+w.sid,{blob:f,name:f.name});drop(w.sid);await ensure(w.sid);n++}catch(e){}}
  await checkMissing();render();toast(`${n} Songs zugeordnet`+(MISSING.size?` · ${MISSING.size} fehlen noch`:' · alles komplett'))}

async function exportBak(){
  const files=[],names={};
  for(const sid of new Set(S.pads.map(p=>p.soundId).filter(x=>x&&!x.startsWith('gen:')))){const r=await get('snd:'+sid);if(r){names[sid]=r.name;files.push({name:'sounds/'+sid+'__'+safeName(r.name),blob:r.blob})}}

  files.unshift({name:'hallen-dj.json',blob:new Blob([JSON.stringify({v:2,state:S,names,logo:!!lg})])});
  const z=await makeZip(files,(i,n)=>toast(`Sicherung wird gepackt … ${i}/${n}`));
  const fn='hallen-dj-sicherung-'+new Date().toISOString().slice(0,10)+'.zip';
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:fn,data:z});toast('Sicherung gespeichert')}catch(e){toast(e&&e.code==='declined'?'Abgebrochen':'Speichern nicht möglich ('+(e&&e.code||'?')+')')}return}

async function importBak(f){

    if(isZip){const z=await readZip(f);const meta=z['hallen-dj.json'];if(!meta)throw new Error('keine Board-Sicherung');const j=JSON.parse(await meta.blob.text());st=j.state;
      for(const [name,e] of Object.entries(z)){if(!name.startsWith('sounds/'))continue;if(e.meth!==0)throw new Error('ZIP ist komprimiert');const sid=name.slice(7).split('__')[0];
        drop(sid);await put('snd:'+sid,{blob:new Blob([e.blob],{type:''}),name:j.names?.[sid]||name.split('__')[1]||'sound'});n++;toast('Lade Sounds … '+n)}
      if(z.logo){await put('logo',z.logo.blob);showLogo(z.logo.blob)}}
    else{const j=JSON.parse(await f.text());st=j.state;if(j.v===3)st.libNames=j.names||{};
      for(const [sid,s] of Object.entries(j.sounds||{})){drop(sid);await put('snd:'+sid,{blob:dataUrlToBlob(s.data),name:s.name});n++}

}

/* ---------- WümmeTicker ---------- */
/* Liest die offene Schnittstelle von wuemmeticker.web.app. Fällt das Netz aus, bleibt der letzte Stand stehen – das Board selbst ist davon nie betroffen. */
const TKB='https://wuemmeticker.web.app';
const TK={ev:{},lastGoal:null,club:null,clubAt:0,data:null,last:0,err:null,timer:0,prev:{},games:[]};
const pdate=s=>new Date(String(s).replace(/([+-]\d\d)(\d\d)$/,'$1:$2'));
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
async function tkFetch(u){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),7000);try{const r=await fetch(u,{signal:ac.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
/* Standard: 1. Herren TuS (sucht nach Verein+Mannschaft, damit es auch nächste Saison mit neuer Staffel passt) */
function tkSel(){const s=S.settings.tkTeam;if(s!=null)return s;const t=(TK.club?.teams||[]).find(t=>t.clubShort==='TuS'&&t.label==='Männer');return t?t.group+'|'+t.label:''}
async function tkLoad(){clearTimeout(TK.timer);
  if(S.settings.tk===false){$('#tkP').hidden=true;return}$('#tkP').hidden=false;
  try{if(!TK.club||Date.now()-TK.clubAt>3600e3){TK.club=await tkFetch(TKB+'/api/club');TK.clubAt=Date.now()}
    const teams=TK.club.teams||[],sel=tkSel();
    TK.tl=sel?teams.filter(t=>t.group+'|'+t.label===sel):teams;
    const groups=[...new Set(TK.tl.map(t=>t.group))];
    if(groups.length){TK.data=await tkFetch(TKB+'/api/live?groups='+groups.join(','))}
    TK.last=Date.now();TK.err=null;
    /* Ereignisse (Tore mit Torschütze) für das angezeigte Spiel, sobald es läuft oder heute gespielt wurde */
    const g0=tkGames()[0];if(g0&&g0.liveId&&(g0.live||(g0.d<=new Date()&&g0.sh+g0.sg>0))){try{const e=await tkFetch(TKB+'/api/events/'+g0.liveId);if(e&&Array.isArray(e.ev))TK.ev[g0.liveId]=e.ev}catch(e){}}}
  catch(e){TK.err=e}
  try{drawTk()}catch(e){console.error(e)}
  const live=TK.games.some(g=>g.live);TK.timer=setTimeout(tkLoad,TK.err?30000:live?10000:60000)}
function tkGames(){const tl=TK.tl||[],ms=TK.data?.meetings||[],now=new Date(),today=now.toDateString();
  const ours=ms.map(m=>{const t=tl.find(t=>t.group===m.group&&(t.name===m.home||t.name===m.guest));return t?{...m,team:t,d:pdate(m.scheduled)}:null}).filter(Boolean);
  let list=ours.filter(m=>m.live||m.d.toDateString()===today).sort((a,b)=>(b.live-a.live)||(a.d-b.d));
  if(!list.length){const nx=ours.filter(m=>m.d>now).sort((a,b)=>a.d-b.d)[0];if(nx){nx.next=true;list=[nx]}}
  return list}
/* Letzter Torschütze aus den Liveticker-Ereignissen: [Typ, Sekunde, Heim, Gast, Seite(1=Heim,0=Gast), Name] – Typ 4 Tor, 5 Siebenmeter, 7 Eigentor */
function scorerHtml(g){if(!g||!g.liveId)return'';const ev=TK.ev[g.liveId];if(!ev)return'';
  let x=null;for(let i=ev.length-1;i>=0;i--)if([4,5,7].includes(ev[i][0])){x=ev[i];break}if(!x)return'';
  const [t,s,ph,pg,side,name]=x,team=side===1?g.home:side===0?g.guest:'',us=team===g.team.name;
  const key=g.liveId+'|'+ev.length,isNew=TK.lastGoal&&TK.lastGoal!==key;TK.lastGoal=key;
  const min=s!=null?Math.floor(s/60)+1+'.':'';
  return `<div class="tsc ${us?'us':''} ${isNew?'flash':''}"><span class="tl">TOR${t===5?' · 7m':t===7?' · Eigentor':''}</span><b>${esc(name||'Torschütze folgt')}</b><small>${esc(team)}${min?' · '+min+' Min':''} · ${ph}:${pg}</small></div>`}
function drawTk(){const box=$('#tk'),st=$('#tkSt');
  if(TK.data){TK.games=tkGames()}
  const live=TK.games.filter(g=>g.live).length;
  st.className='stat'+(live?' red':'');st.hidden=!TK.err;st.innerHTML=live?'<span class="lv">LIVE</span>':TK.err?(TK.data?'OFFLINE · '+hm(new Date(TK.last)):'OFFLINE'):'';
  if(!TK.data){box.innerHTML='<div class="tkmsg">Kein Empfang – Ticker meldet sich, sobald Internet da ist. Das Board läuft normal weiter.</div>';return}
  if(!TK.games.length){box.innerHTML='<div class="tkmsg">Heute keine Spiele der ausgewählten Mannschaften.</div>';return}
  const img=id=>id?`<img src="${TKB}/api/image/${esc(id)}" alt="" loading="lazy" onerror="this.replaceWith(document.createElement('i'))">`:'<i></i>';
  const show=TK.games.slice(0,3);const now=new Date();
  box.innerHTML=show.map(g=>{const key=g.liveId,score=g.sh+':'+g.sg,changed=TK.prev[key]&&TK.prev[key]!==score;TK.prev[key]=score;
    const started=g.d<=now,has=g.sh+g.sg>0,end=!g.live&&started&&has&&(now-g.d)>75*60e3;
    const cls=g.live?'live':end?'end':'';
    const mid=g.live||(started&&has)?`<b>${g.sh}:${g.sg}</b><small>${g.live?'<span class="lv">LIVE</span>':end?'Ende':''}${g.hth!=null&&(g.hth||g.htg)?' · HZ '+g.hth+':'+g.htg:''}</small>`
      :`<b>${hm(g.d)}</b><small>${g.next?g.d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}):'Anwurf'}</small>`;
    const us=n=>n===g.team.name?'us':'';
    return `<div class="tg ${cls}"><div class="lg"><span>${esc(g.team.clubShort||'')} ${esc(g.team.label)}</span><span>${g.next?'Nächstes Spiel':esc(g.team.league||'')}</span></div>
      <div class="tm2 ${us(g.home)}">${img(g.homeImg)}<span>${esc(g.home)}</span></div><div class="sc ${changed?'flash':''}">${mid}</div><div class="tm2 ${us(g.guest)}">${img(g.guestImg)}<span>${esc(g.guest)}</span></div></div>`}).join('')+
    (TK.games.length>3?`<div class="tkmore">+ ${TK.games.length-3} weitere Spiele heute</div>`:'')+scorerHtml(show[0]);try{renderNow()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tkLoad()});
window.addEventListener('online',()=>tkLoad());

/* ---------- Logo ---------- */
let logoUrl='';
function showLogo(blob){if(logoUrl)URL.revokeObjectURL(logoUrl);logoUrl=blob?URL.createObjectURL(blob):'';const l=$('#logo');if(logoUrl){l.src=logoUrl;l.hidden=false}else{l.removeAttribute('src');l.hidden=true}}
$('#logoIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;await put('logo',f);showLogo(f);openSet();toast('Logo gespeichert')});

/* ---------- Offline-Betrieb (nur wenn als eigene Seite gehostet) ---------- */
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

/* ---------- Start ---------- */
(async()=>{await openDb();try{const st=await get('state');if(st&&st.cats)S=st}catch(e){}
  const MIG={'#2f6bff':'#3d7bff','#0aa5c9':'#22c3e6','#17b26a':'#2fd17a','#7cb305':'#c6ff3d','#f5a524':'#ffc21a','#f2711c':'#ff7a1a','#e3262f':'#ff3344','#d6127e':'#ff3d9a','#9b51e0':'#8f7bff','#5b6676':'#8a95a8','#1f2937':'#ffffff','#b7791f':'#d4a35a'};
  if(!S.settings.mig2){S.settings.mig2=1;if(!S.cats.some(c=>c.players)){const i=Math.max(0,S.cats.findIndex(c=>/tor/i.test(c.name))+1);S.cats.splice(i,0,{id:uid(),name:'Torsongs Spieler',color:'#c6ff3d',players:true})}save()}
  S.cats.forEach(c=>{if(MIG[c.color])c.color=MIG[c.color]});
  if(!S.settings.mig3){S.settings.mig3=1;const M3={'#ffffff':'#6366f1','#3d7bff':'#0ea5e9','#22c3e6':'#eab308','#2fd17a':'#22c55e','#c6ff3d':'#14b8a6','#ffc21a':'#a855f7','#ff7a1a':'#f97316','#ff3344':'#ef4444','#ff3d9a':'#ec4899','#8f7bff':'#a855f7','#8a95a8':'#64748b','#d4a35a':'#eab308'};
    S.cats.forEach(c=>{if(M3[c.color])c.color=M3[c.color]});S.pads.forEach(p=>{if(M3[p.color])p.color=M3[p.color]});if(S.settings.cols===4)S.settings.cols=5;save()}S.pads.forEach(p=>{if(MIG[p.color])p.color=MIG[p.color]});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  $('#mv').value=S.settings.master;$('#mvo').textContent=S.settings.master;master.gain.value=vol(S.settings.master);
  try{const lg=await get('logo');if(lg)showLogo(lg)}catch(e){}
  showMixer();applySide();tkLoad();checkMissing().then(s=>{if(s.size)render()});
  render();renderNow();
  preloadAll(); // nacheinander laden = wenig Speicherspitze
})();
}
</script>
